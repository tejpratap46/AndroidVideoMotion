[versions]
constraintlayoutVersion = "2.2.1"
contourVersion = "1.1.0"
filamentAndroidVersion = "1.68.1"
jcodecVersion = "0.2.5"
jsoupVersion = "1.21.2"
ktorClientCoreVersion = "3.3.3"
ktx_version = "1.17.0"
appcompat_version = "1.7.1"
material_version = "1.13.0"
lifecycle_runtime_ktx = "2.10.0"
picassoVersion = "2.71828"
smartExceptionJavaVersion = "0.2.1"
tensorflowLiteTaskVisionVersion = "0.5.0"
tensorflowLiteVersion = "2.17.0"
wordfindVersion = "2.5.4"
work_version = "2.11.0"
junit_version = "4.13.2"
androidx_test_ext_junit_version = "1.3.0"
espresso_core_version = "3.7.0"
agpVersion = "8.13.2"
kotlinVersion = "2.2.21"
pytorchAndroidTorchCisionLite = "2.1.0"
kotlinGradlePluginVersion = "2.2.0"
activityVersion = "1.12.1"
gson = "2.13.2"
activityComposeVersion = "1.12.1"
composeBomVersion = "2025.12.00"
navigationComposeVersion = "2.9.6"
ktlint = "14.0.1"
runtimeVersion = "1.10.0"

[libraries]
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayoutVersion" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "ktx_version" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat_version" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle_runtime_ktx" }
contour = { module = "app.cash.contour:contour", version.ref = "contourVersion" }
filament-android = { module = "com.google.android.filament:filament-android", version.ref = "filamentAndroidVersion" }
filament-utils-android = { module = "com.google.android.filament:filament-utils-android", version.ref = "filamentAndroidVersion" }
gltfio-android = { module = "com.google.android.filament:gltfio-android", version.ref = "filamentAndroidVersion" }
google-android-material = { group = "com.google.android.material", name = "material", version.ref = "material_version" }

androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle_runtime_ktx" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work_version" }

jcodec = { module = "org.jcodec:jcodec", version.ref = "jcodecVersion" }
jcodec-android = { module = "org.jcodec:jcodec-android", version.ref = "jcodecVersion" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoupVersion" }
junit = { group = "junit", name = "junit", version.ref = "junit_version" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx_test_ext_junit_version" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso_core_version" }
ktlint-gradle = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktorClientCoreVersion" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktorClientCoreVersion" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktorClientCoreVersion" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktorClientCoreVersion" }
picasso = { module = "com.squareup.picasso:picasso", version.ref = "picassoVersion" }
smart-exception-java = { module = "com.arthenica:smart-exception-java", version.ref = "smartExceptionJavaVersion" }
tensorflow-lite = { module = "org.tensorflow:tensorflow-lite", version.ref = "tensorflowLiteVersion" }
tensorflow-lite-gpu-delegate-plugin = { module = "org.tensorflow:tensorflow-lite-gpu-delegate-plugin", version.ref = "tensorflowLiteTaskVisionVersion" }
tensorflow-lite-support = { module = "org.tensorflow:tensorflow-lite-support", version.ref = "tensorflowLiteTaskVisionVersion" }
tensorflow-lite-task-vision = { module = "org.tensorflow:tensorflow-lite-task-vision", version.ref = "tensorflowLiteTaskVisionVersion" }
pytorch_android_lite = { module = "org.pytorch:pytorch_android_lite", version.ref = "pytorchAndroidTorchCisionLite" }
pytorch_android_torchvision_lite = { module = "org.pytorch:pytorch_android_torchvision_lite", version.ref = "pytorchAndroidTorchCisionLite" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activityVersion" }
wordfind = { module = "com.github.word-view:WordFind", version.ref = "wordfindVersion" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityComposeVersion" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBomVersion" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationComposeVersion" }
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime", version.ref = "runtimeVersion" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agpVersion" }
android-library = { id = "com.android.library", version.ref = "agpVersion" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlinVersion" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlinVersion" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlinVersion" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlinVersion" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }

[bundles]
androidx = [
    "androidx-constraintlayout",
    "androidx-core-ktx",
    "androidx-appcompat",
    "androidx-activity",
    "androidx-lifecycle-runtime-ktx",
    "androidx-work-runtime-ktx"
]
filament = [
    "filament-android",
    "filament-utils-android",
    "gltfio-android"
]
jcodec = [
    "jcodec",
    "jcodec-android"
]
ktor = [
    "ktor-client-cio",
    "ktor-client-core",
]
test = [
    "junit",
    "androidx-test-ext-junit",
    "androidx-test-espresso-core"
]
material = [
    "google-android-material"
]
contour = [
    "contour"
]
smart-exception = [
    "smart-exception-java"
]
tensorflow-lite = [
    "tensorflow-lite-gpu-delegate-plugin",
    "tensorflow-lite-task-vision",
    "tensorflow-lite-support",
    "tensorflow-lite"
]
compose = [
    "androidx-activity-compose",
    "androidx-lifecycle-runtime-ktx",
    "androidx-compose-bom",
    "androidx-ui",
    "androidx-ui-graphics",
    "androidx-ui-tooling",
    "androidx-ui-tooling-preview",
    "androidx-material3",
    "androidx-compose-runtime"
]