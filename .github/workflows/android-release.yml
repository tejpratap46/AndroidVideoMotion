name: Build and Attach ALL Release Artifacts to Release

on:
  # Trigger when a release is published, including pre-releases
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build_and_attach:
    runs-on: ubuntu-latest

    # Run for both normal releases and pre-releases.
    # Draft releases are not published, but keep this guard for safety.
    if: github.event.release.draft == false

    steps:
      - name: ⚙️ Checkout Repository
        uses: actions/checkout@v4
        with:
          # Build exactly the commit associated with the release tag
          ref: ${{ github.event.release.tag_name }}

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 📁 Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" \
            | openssl base64 -d > modules/lyrics-maker/google-services.json

      - name: 🔑 Decode Keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE }}" \
            | openssl base64 -d -A > release.jks

      - name: 🔨 Build ALL Release Artifacts (APKs & AARs)
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/release.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.RELEASE_KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.RELEASE_KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: 📌 Define ALL Artifact Paths
        id: artifact_paths
        run: |
          echo "🔎 Searching for APKs and AARs..."

          ARTIFACT_FILES=$(find . \
            \( \
              -path '*/build/outputs/apk/release/*.apk' \
              -o \
              -path '*/build/outputs/aar/*-release.aar' \
            \) \
            -type f)

          if [ -z "$ARTIFACT_FILES" ]; then
            echo "::warning::No release APKs or AARs found in the standard build paths."
            echo "ARTIFACT_FILES=" >> "$GITHUB_OUTPUT"
          else
            echo "✅ Found the following artifacts:"
            echo "$ARTIFACT_FILES"

            echo "ARTIFACT_FILES<<EOF" >> "$GITHUB_OUTPUT"
            echo "$ARTIFACT_FILES" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: 📤 Upload ALL Artifacts to Release Assets
        if: steps.artifact_paths.outputs.ARTIFACT_FILES != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ${{ steps.artifact_paths.outputs.ARTIFACT_FILES }}
          token: ${{ secrets.GITHUB_TOKEN }}
          overwrite_files: true

      - name: 🧹 Cleanup Signing Keystore
        if: always()
        run: rm -f release.jks
