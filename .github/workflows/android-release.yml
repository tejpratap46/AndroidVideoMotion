name: Build and Attach all Release Artifacts to Release

on:
  release:
    types: [published]

  workflow_call:
    inputs:
      release_tag:
        description: "Release tag to build and attach artifacts to"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build_and_attach:
    name: Build and Attach Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" \
            | openssl base64 -d \
            > modules/lyrics-maker/google-services.json

      - name: Decode Keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE }}" \
            | openssl base64 -d -A \
            > release.jks

      - name: Build ALL Release Artifacts
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$(pwd)/release.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.RELEASE_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.RELEASE_KEY_PASSWORD }}"

      - name: Define ALL Artifact Paths
        id: artifact_paths
        shell: bash
        run: |
          echo "Searching for APKs and AARs..."

          ARTIFACT_FILES=$(find . \
            \( \
              -path '*/build/outputs/apk/release/*.apk' \
              -o \
              -path '*/build/outputs/aar/*-release.aar' \
            \) \
            -type f \
            | sort)

          if [ -z "$ARTIFACT_FILES" ]; then
            echo "::error::No release APKs or AARs found."
            exit 1
          fi

          echo "Found artifacts:"
          echo "$ARTIFACT_FILES"

          {
            echo "ARTIFACT_FILES<<EOF"
            echo "$ARTIFACT_FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload ALL Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.event.release.tag_name }}
          files: ${{ steps.artifact_paths.outputs.ARTIFACT_FILES }}
          token: ${{ secrets.GITHUB_TOKEN }}
          overwrite_files: true

      - name: Cleanup Signing Keystore
        if: always()
        run: |
          rm -f release.jks