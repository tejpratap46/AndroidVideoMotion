name: Nightly Release

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-nightly-release:
    name: Create Nightly Release
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Nightly Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="nightly"
          DATE="$(date -u '+%Y-%m-%d')"
          SHA="$(git rev-parse HEAD)"

          echo "Creating nightly release"
          echo "Tag: $TAG"
          echo "Date: $DATE"
          echo "Commit: $SHA"

          # Delete the previous nightly release and tag.
          gh release delete "$TAG" \
            --yes \
            --cleanup-tag \
            2>/dev/null || true

          # Create the new nightly pre-release.
          gh release create "$TAG" \
            --target "$SHA" \
            --title "Nightly $DATE" \
            --prerelease \
            --notes "$(cat <<EOF
          ## Nightly Release

          Automated nightly build.

          **Date:** $DATE
          **Commit:** $SHA

          > This is an automated pre-release and may be unstable.
          EOF
          )"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build-and-attach:
    name: Build and Attach Artifacts
    needs: create-nightly-release

    uses: ./.github/workflows/android-release.yml

    with:
      release_tag: ${{ needs.create-nightly-release.outputs.tag }}

    secrets: inherit
