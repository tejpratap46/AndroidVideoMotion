# .github/workflows/nightly-release.yml

name: Nightly Release

on:
  schedule:
    # Every night at 00:00 UTC
    - cron: "0 0 * * *"

  # Allow manual execution from GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nightly-release:
    name: Build Nightly Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Add your project build/setup steps here
      # - name: Setup Java
      #   uses: actions/setup-java@v5
      #   with:
      #     distribution: temurin
      #     java-version: "21"

      # - name: Build
      #   run: ./gradlew assembleRelease

      - name: Generate release metadata
        id: metadata
        run: |
          echo "date=$(date -u +'%Y.%m.%d')" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Delete previous nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly \
            --yes \
            --cleanup-tag \
            2>/dev/null || true

      - name: Create nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create nightly \
            --target "${{ github.sha }}" \
            --title "Nightly ${{ steps.metadata.outputs.date }}" \
            --notes "$(cat <<EOF
          ## Nightly Release

          Automated nightly build from \`${{ github.ref_name }}\`.

          **Commit:** \`${GITHUB_SHA}\`
          **Build:** ${{ steps.metadata.outputs.date }}

          > This is an automated pre-release and may be unstable.
          EOF
          )" \
            --prerelease
