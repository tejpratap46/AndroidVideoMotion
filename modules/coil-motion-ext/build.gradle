plugins {
    alias(libs.plugins.android.library)
    id 'maven-publish'
}

android {
    compileSdk 36

    defaultConfig {
        minSdk 28

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    namespace 'com.tejpratapsingh.motionlib.coil'
    lint {
        targetSdk 36
    }
    testOptions {
        targetSdk 36
    }
    publishing {
        singleVariant("release")
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
            }
        }
    }
}

dependencies {
    api project(path: ':modules:core')
    api project(path: ':modules:motionlib')
    api project(path: ':modules:sdui')
    implementation libs.androidx.appcompat
    implementation libs.coil
    implementation libs.coil.video
    implementation libs.coil.transformations
    implementation libs.coil.transformations.gpu
    implementation libs.coil.transformations.face.detection

    testImplementation libs.junit
}
